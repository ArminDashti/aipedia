name: aipedia
services:
  aipedia-webui:
    image: ${IMAGE_TAG:-aipedia-webui:latest}
    container_name: aipedia-webui
    environment:
      API_HOST: ${API_HOST:-aipedia-api}
      API_PORT: ${API_PORT:-8091}
    expose:
      - "${INTERNAL_PORT:-80}"
    ports:
      - target: ${INTERNAL_PORT:-80}
        published: ${PUBLISH_PORT:-5174}
        protocol: tcp
    networks:
      - aipedia-net
    restart: "no"

networks:
  aipedia-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true