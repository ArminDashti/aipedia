<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('aipedia-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <title>AIPedia — AI Knowledge Encyclopedia</title>
    <meta
      name="description"
      content="AIPedia is a public AI knowledge encyclopedia. Browse catalogs of skills, MCP servers, tools, companies, models, code editors, and chatbots."
    />
    <meta name="author" content="Armin Dashti" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta
      name="keywords"
      content="AIPedia, AI encyclopedia, artificial intelligence, MCP, AI models, AI tools, AI agents, chatbots, coding agents"
    />
    <link rel="canonical" href="https://aipedia.xaigrok.ir/" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="AIPedia" />
    <meta property="og:url" content="https://aipedia.xaigrok.ir/" />
    <meta property="og:title" content="AIPedia — AI Knowledge Encyclopedia" />
    <meta
      property="og:description"
      content="Browse catalogs of AI skills, MCP servers, tools, companies, models, code editors, and chatbots."
    />
    <meta property="og:image" content="https://aipedia.xaigrok.ir/og.png" />
    <meta property="og:image:alt" content="AIPedia — AI Knowledge Encyclopedia" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AIPedia — AI Knowledge Encyclopedia" />
    <meta
      name="twitter:description"
      content="Browse catalogs of AI skills, MCP servers, tools, companies, models, code editors, and chatbots."
    />
    <meta name="twitter:image" content="https://aipedia.xaigrok.ir/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="sitemap"
      type="application/xml"
      title="Sitemap"
      href="https://aipedia.xaigrok.ir/sitemap.xml"
    />

    <script id="aipedia-json-ld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://aipedia.xaigrok.ir/#website",
            "name": "AIPedia",
            "url": "https://aipedia.xaigrok.ir/",
            "description": "A public AI knowledge encyclopedia with catalogs of skills, MCP, tools, companies, models, code, and chatbots.",
            "inLanguage": "en",
            "author": {
              "@type": "Person",
              "name": "Armin Dashti",
              "url": "https://armindashti.github.io/"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://aipedia.xaigrok.ir/#organization",
            "name": "AIPedia",
            "url": "https://aipedia.xaigrok.ir/",
            "logo": "https://aipedia.xaigrok.ir/favicon.svg"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
