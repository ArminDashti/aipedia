# Local Docker hot-reload for aipedia-api + aipedia-webui (SQLite, no Postgres).
name: aipedia
services:
  api:
    image: golang:1.23-alpine
    restart: "no"
    working_dir: /app
    environment:
      GIN_MODE: debug
      ADDR: ":8091"
      DATABASE_URL: /app/data/aipedia.db
      MIGRATIONS_DIR: migrations
    command:
      - sh
      - -c
      - apk add --no-cache git gcc musl-dev && go install github.com/air-verse/air@v1.61.7 && mkdir -p /app/data /app/tmp && air -c .air.toml
    volumes:
      - .:/app
      - aipedia-gomod:/go/pkg/mod
      - aipedia-gotmp:/app/tmp
      - aipedia-sqlite-data:/app/data
    ports:
      - "8172:8091"
    networks:
      - aipedia-local

  webui:
    image: node:22-alpine
    restart: "no"
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY: http://api:8091
      VITE_SITE_URL: http://localhost:5174
      VITE_API_BASE_URL: ""
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0 --port 5174 --strictPort
    volumes:
      - ../aipedia-webui:/app
      - aipedia-webui-node-modules:/app/node_modules
    ports:
      - "5174:5174"
    depends_on:
      - api
    networks:
      - aipedia-local

networks:
  aipedia-local:
    name: aipedia-local

volumes:
  aipedia-gomod:
  aipedia-gotmp:
  aipedia-sqlite-data:
  aipedia-webui-node-modules:
